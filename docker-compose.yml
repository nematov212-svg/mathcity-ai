version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: mathcity-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-mathcity_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-mathcity_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mathcity-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mathcity-backend
    restart: always
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-mathcity_db}?schema=public
      JWT_SECRET: ${JWT_SECRET:-change-this-ultra-secure-key-32-chars-long}
      JWT_EXPIRES_IN: 7d
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:8085,https://mathcity-ai-web.onrender.com}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - mathcity-network

volumes:
  postgres_data:

networks:
  mathcity-network:
    driver: bridge
