name: mathcity_ai
description: "MathCity AI — Educational Mathematics Platform (Kids & Teen Mode)"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.3.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^2.0.0

  # State Management
  flutter_riverpod: ^2.6.1

  # Navigation
  go_router: ^14.6.2

  # Networking
  dio: ^5.7.0

  # Storage & Security
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.3

  # Authentication & Subscriptions
  google_sign_in: ^6.2.2
  google_sign_in_web: ^0.12.4+4
  in_app_purchase: ^3.2.0

  # UI, Math & Charts
  flutter_math_fork: ^0.7.2
  fl_chart: ^0.69.0
  google_fonts: ^6.2.1
  intl: ^0.19.0
  uuid: ^4.5.1
  equatable: ^2.0.7
  image_picker: ^1.2.4
  file_picker: ^11.0.3
  record: ^7.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/illustrations/
    - assets/logos/
    - assets/icons/
    - assets/coins/
    - assets/games/
    - assets/city/
    - assets/animations/
