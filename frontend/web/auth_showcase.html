<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>MathCity AI — Kirish va Ro‘yxatdan o‘tish oqimi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    /* ━━ 1. RANGLAR (CSS O'ZGARUVCHILARI) ━━ */
    :root {
      --bg: #f6f4ff;
      --card: #ffffff;
      --field: #f8f7ff;
      --line: #e6e2fb;
      --tint: #ece8ff;
      --ink: #1d1646;
      --mute: #7a74a3;
      --brand: #6a4cff;
      --brand2: #8b5cf6;
      --brand-gradient: linear-gradient(135deg, #6a4cff, #8b5cf6);
      --gold: #ffc83d;
      --gold-text: #b7791f;
      --gold-bg: #fff4d1;
      --error: #e5484d;
      --success: #22c55e;
      --shadow: rgba(106, 76, 255, 0.16);
      --btn-shadow: 0 14px 28px rgba(106, 76, 255, 0.38);
      --inner-card-bg: var(--field);
    }

    [data-theme="dark"] {
      --bg: #120e2b;
      --card: #1c1740;
      --field: #252050;
      --line: #332d68;
      --tint: #2b2560;
      --ink: #f1eeff;
      --mute: #9d97c9;
      --gold: #ffc83d;
      --gold-text: #f6c86a;
      --gold-bg: #3d2f10;
      --shadow: rgba(0, 0, 0, 0.45);
      --btn-shadow: 0 14px 28px rgba(106, 76, 255, 0.28);
      --inner-card-bg: #201a47;
    }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #120e2b;
        --card: #1c1740;
        --field: #252050;
        --line: #332d68;
        --tint: #2b2560;
        --ink: #f1eeff;
        --mute: #9d97c9;
        --gold: #ffc83d;
        --gold-text: #f6c86a;
        --gold-bg: #3d2f10;
        --shadow: rgba(0, 0, 0, 0.45);
        --btn-shadow: 0 14px 28px rgba(106, 76, 255, 0.28);
        --inner-card-bg: #201a47;
      }
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Nunito', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--ink);
      min-height: 100vh;
      min-height: 100dvh;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
      transition: background-color 0.25s ease, color 0.25s ease;
      position: relative;
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }

    /* ━━ DEMO TOOLBAR (NAVIGATSIYA) ━━ */
    .demo-navbar {
      position: sticky;
      top: 0;
      z-index: 900;
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-bottom: 1.5px solid var(--line);
      padding: 10px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }
    [data-theme="dark"] .demo-navbar {
      background: rgba(28, 23, 64, 0.88);
    }
    .demo-brand-logo {
      font-weight: 800;
      font-size: 15px;
      color: var(--brand);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .demo-nav-tabs {
      display: flex;
      align-items: center;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 2px;
      max-width: 100%;
      scrollbar-width: none;
    }
    .demo-nav-tabs::-webkit-scrollbar {
      display: none;
    }
    .demo-tab-btn {
      background: var(--field);
      border: 1px solid var(--line);
      color: var(--ink);
      padding: 6px 12px;
      border-radius: 999px;
      font-family: inherit;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s ease;
    }
    .demo-tab-btn:hover {
      border-color: var(--brand);
      color: var(--brand);
    }
    .demo-tab-btn.active {
      background: var(--brand);
      color: #fff;
      border-color: var(--brand);
      box-shadow: 0 4px 12px rgba(106, 76, 255, 0.3);
    }
    .demo-theme-btn {
      background: var(--tint);
      border: 1px solid var(--line);
      color: var(--brand);
      padding: 6px 12px;
      border-radius: 999px;
      font-family: inherit;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
    }

    /* ━━ AMBIENT ORBS VA FON ━━ */
    .ambient-bg {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 0;
    }
    .ambient-orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(70px);
      will-change: transform;
    }
    .orb-purple {
      width: 420px;
      height: 420px;
      background: var(--brand);
      opacity: 0.45;
      top: -120px;
      left: -120px;
      animation: driftOrbPurple 14s ease-in-out infinite alternate;
    }
    .orb-gold {
      width: 420px;
      height: 420px;
      background: var(--gold);
      opacity: 0.28;
      bottom: -120px;
      right: -120px;
      animation: driftOrbGold 14s ease-in-out infinite alternate;
    }
    @keyframes driftOrbPurple {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(60px, 80px) scale(1.15); }
    }
    @keyframes driftOrbGold {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(-70px, -60px) scale(1.2); }
    }

    /* 8 Ta suzuvchi matematik belgi */
    .math-symbol {
      position: absolute;
      color: var(--brand);
      opacity: 0.16;
      font-weight: 800;
      user-select: none;
      pointer-events: none;
      animation: floatMath 7s ease-in-out infinite alternate;
    }
    @keyframes floatMath {
      0% { transform: translateY(0) rotate(0deg); }
      100% { transform: translateY(-16px) rotate(14deg); }
    }

    /* ━━ ASOSIY KONTEYNER ━━ */
    .app-viewport {
      position: relative;
      flex: 1;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1;
    }

    /* ━━ A. TELEFON (< 600px) MOBILE-FIRST ━━ */
    .mobile-view-container {
      width: 100%;
      max-width: 440px;
      margin: 0 auto;
      padding: 18px 22px 32px 22px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Masot Logotip Doirasi */
    .mascot-plate-wrap {
      position: relative;
      margin-bottom: 18px;
    }
    .mascot-pulse-ring {
      position: absolute;
      inset: -8px;
      border-radius: 50%;
      background: rgba(235, 230, 255, 0.6);
      animation: pulseRing 2.6s ease-out infinite;
      z-index: 1;
    }
    [data-theme="dark"] .mascot-pulse-ring {
      background: rgba(43, 37, 96, 0.6);
    }
    @keyframes pulseRing {
      0% { transform: scale(0.9); opacity: 0.8; }
      100% { transform: scale(1.35); opacity: 0; }
    }
    .mascot-plate {
      position: relative;
      z-index: 2;
      width: 132px;
      height: 132px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #ffffff 0%, #ebe6ff 100%);
      box-shadow: 0 18px 40px var(--shadow);
      display: flex;
      align-items: center;
      justify-content: center;
      animation: mascotEntry 0.9s cubic-bezier(0.2, 1.4, 0.4, 1) forwards, mascotBob 4s ease-in-out infinite alternate 0.9s;
    }
    [data-theme="dark"] .mascot-plate {
      background: radial-gradient(circle at 35% 30%, #2b2560 0%, #1c1740 100%);
    }
    @keyframes mascotEntry {
      0% { transform: scale(0.3) rotate(-20deg); opacity: 0; }
      100% { transform: scale(1) rotate(0deg); opacity: 1; }
    }
    @keyframes mascotBob {
      0% { transform: translateY(0); }
      100% { transform: translateY(-5px); }
    }
    .mascot-img {
      width: 112px;
      height: 112px;
      object-fit: contain;
    }

    /* Tipografiya */
    .screen-h1 {
      font-size: clamp(27px, 2vw + 20px, 38px);
      font-weight: 800;
      letter-spacing: -0.02em;
      color: var(--ink);
      text-align: center;
      margin-bottom: 6px;
      animation: fadeInUp 0.5s ease-out 0.25s backwards;
    }
    .screen-sub {
      font-size: clamp(15px, 0.4vw + 14px, 17px);
      font-weight: 500;
      line-height: 1.5;
      color: var(--mute);
      text-align: center;
      max-width: 360px;
      margin-bottom: 22px;
      animation: fadeInUp 0.5s ease-out 0.35s backwards;
    }
    @keyframes fadeInUp {
      0% { opacity: 0; transform: translateY(14px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    /* Karta (Kirish va Ro'yxatdan o'tish) */
    .auth-main-card {
      width: 100%;
      background: var(--card);
      border-radius: 30px;
      border: 1.5px solid var(--line);
      box-shadow: 0 24px 60px var(--shadow);
      padding: 26px 22px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      animation: cardEntry 0.6s cubic-bezier(0.2, 0.9, 0.3, 1) 0.45s backwards;
    }
    @keyframes cardEntry {
      0% { opacity: 0; transform: translateY(22px) scale(0.97); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* Maydonlar (Inputs) */
    .field-block {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }
    .field-label {
      font-size: 15px;
      font-weight: 800;
      color: var(--ink);
    }
    .input-box {
      position: relative;
      display: flex;
      align-items: center;
      background: var(--field);
      border: 2px solid var(--line);
      border-radius: 18px;
      height: 56px;
      padding: 0 16px;
      transition: all 0.2s ease;
    }
    .input-box:focus-within {
      border-color: var(--brand);
      background: #ffffff;
      box-shadow: 0 0 0 4px rgba(106, 76, 255, 0.15);
    }
    [data-theme="dark"] .input-box:focus-within {
      background: var(--field);
    }
    .input-box.field-success {
      border-color: var(--success) !important;
      background: #ffffff;
    }
    [data-theme="dark"] .input-box.field-success {
      background: var(--field);
    }
    .input-box.field-error {
      border-color: var(--error) !important;
      box-shadow: 0 0 0 4px rgba(229, 72, 77, 0.15) !important;
    }
    .input-leading-icon {
      position: absolute;
      left: 16px;
      width: 22px;
      height: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--mute);
      pointer-events: none;
      z-index: 1;
      transition: color 0.2s ease;
    }
    .input-box:focus-within .input-leading-icon {
      color: var(--brand);
    }
    .input-native {
      width: 100%;
      height: 100%;
      padding-left: 34px;
      padding-right: 36px;
      border: none;
      outline: none;
      background: transparent;
      font-family: inherit;
      font-size: 16px;
      font-weight: 700;
      color: var(--ink);
    }
    .input-native::placeholder {
      color: #9a97b0;
      font-weight: 500;
    }

    /* O'ng tomondagi tugmalar/ikonkalar */
    .input-trailing {
      position: absolute;
      right: 8px;
      display: flex;
      align-items: center;
      gap: 6px;
      z-index: 2;
    }
    .eye-btn {
      width: 40px;
      height: 40px;
      border: none;
      background: transparent;
      color: var(--mute);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      border-radius: 50%;
      transition: color 0.2s ease;
    }
    @media (hover: hover) {
      .eye-btn:hover { color: var(--ink); }
    }
    .eye-btn:active {
      transform: scale(0.92);
    }

    /* Pop-up Yashil Checkmark */
    .pop-check-icon {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: var(--success);
      color: #ffffff;
      display: none;
      align-items: center;
      justify-content: center;
    }
    .pop-check-icon.active {
      display: flex;
      animation: checkmarkPop 0.35s cubic-bezier(0.2, 1.6, 0.4, 1) forwards;
    }
    @keyframes checkmarkPop {
      0% { transform: scale(0); opacity: 0; }
      80% { transform: scale(1.22); }
      100% { transform: scale(1); opacity: 1; }
    }

    /* Parol kuchi 4-bar indikator */
    .strength-wrapper {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-top: -6px;
    }
    .strength-bars-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
    }
    .strength-segment {
      height: 6px;
      border-radius: 3px;
      background: var(--line);
      transition: background-color 0.25s ease;
    }
    .field-hint-text {
      font-size: 13px;
      font-weight: 600;
      color: var(--mute);
      transition: color 0.25s ease;
    }

    /* Parolni unutdingizmi */
    .forgot-link-box {
      display: flex;
      justify-content: flex-end;
      margin-top: -6px;
    }
    .forgot-btn-link {
      font-size: 14px;
      font-weight: 800;
      color: var(--brand);
      text-decoration: none;
      padding: 4px;
    }
    .forgot-btn-link:hover {
      text-decoration: underline;
    }

    /* Asosiy Tugma */
    .primary-btn {
      position: relative;
      overflow: hidden;
      width: 100%;
      height: 58px;
      border-radius: 20px;
      background: var(--brand-gradient);
      color: #ffffff;
      border: none;
      outline: none;
      font-family: inherit;
      font-size: 17px;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      box-shadow: var(--btn-shadow);
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .primary-btn::after {
      content: '';
      position: absolute;
      top: -50%;
      left: -120%;
      width: 60%;
      height: 200%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.38), transparent);
      transform: skewX(-20deg);
      animation: btnSweep 3.6s ease-in-out infinite;
    }
    @keyframes btnSweep {
      0%, 60% { left: -120%; }
      85%, 100% { left: 160%; }
    }
    @media (hover: hover) {
      .primary-btn:hover {
        filter: brightness(1.08);
        transform: translateY(-1.5px);
        box-shadow: 0 18px 34px rgba(106, 76, 255, 0.44);
      }
    }
    .primary-btn:active {
      transform: scale(0.98);
    }
    .primary-btn.btn-loading {
      pointer-events: none;
      opacity: 0.92;
    }
    .btn-loader-circle {
      width: 24px;
      height: 24px;
      border: 3px solid rgba(255, 255, 255, 0.3);
      border-top-color: #ffffff;
      border-radius: 50%;
      animation: spinLoader 0.75s linear infinite;
    }
    @keyframes spinLoader {
      to { transform: rotate(360deg); }
    }
    .primary-btn.btn-success-state {
      background: linear-gradient(135deg, #22c55e, #16a34a);
      box-shadow: 0 14px 28px rgba(34, 197, 94, 0.4);
    }

    /* Ajratgich "yoki davom eting" */
    .sep-divider-row {
      display: flex;
      align-items: center;
      gap: 14px;
      margin: 4px 0;
    }
    .sep-line {
      flex: 1;
      height: 1.5px;
      background: var(--line);
    }
    .sep-text {
      font-size: 13px;
      font-weight: 600;
      color: var(--mute);
    }

    /* Google Button */
    .google-btn {
      width: 100%;
      height: 56px;
      border-radius: 18px;
      background: #ffffff;
      border: 2px solid var(--line);
      color: var(--ink);
      font-family: inherit;
      font-size: 15px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.04);
      transition: all 0.2s ease;
    }
    [data-theme="dark"] .google-btn {
      background: #1c1740;
      color: #f1eeff;
    }
    @media (hover: hover) {
      .google-btn:hover {
        border-color: var(--brand);
        background: #faf9ff;
        transform: translateY(-1px);
      }
      [data-theme="dark"] .google-btn:hover {
        background: #252050;
      }
    }
    .google-btn:active {
      transform: scale(0.98);
    }
    .google-icon-svg {
      width: 22px;
      height: 22px;
    }

    /* Pastki Switch Havolasi */
    .switch-link-footer {
      margin-top: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      flex-wrap: wrap;
      text-align: center;
      animation: fadeInUp 0.5s ease-out 0.75s backwards;
    }
    .switch-caption {
      font-size: 15px;
      font-weight: 600;
      color: var(--mute);
    }
    .switch-action {
      font-size: 15px;
      font-weight: 800;
      color: var(--brand);
      text-decoration: none;
      cursor: pointer;
      padding: 4px;
    }
    .switch-action:hover {
      text-decoration: underline;
    }

    /* Shake Animatsiyasi */
    @keyframes shakeCardAnim {
      0%, 100% { transform: translateX(0); }
      15% { transform: translateX(-7px); }
      30% { transform: translateX(7px); }
      45% { transform: translateX(-6px); }
      60% { transform: translateX(6px); }
      75% { transform: translateX(-3px); }
      90% { transform: translateX(3px); }
    }
    .shake-trigger {
      animation: shakeCardAnim 0.4s ease-in-out !important;
    }

    /* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
    /* ━━ 6. KARKAS — 3 BOSQICH KOMPONENTLARI                             */
    /* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
    .step-screen-canvas {
      width: 100%;
      display: flex;
      flex-direction: column;
    }
    .step-top-header {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }
    .step-back-btn {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: var(--tint);
      border: 1px solid var(--line);
      color: var(--brand);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .step-back-btn:disabled {
      opacity: 0.25;
      cursor: not-allowed;
      pointer-events: none;
    }
    .step-back-btn:not(:disabled):active {
      transform: scale(0.92);
    }
    .step-count-text {
      font-size: 15px;
      font-weight: 700;
      color: var(--mute);
    }
    .step-header-spacer {
      width: 44px;
    }

    /* 3-Segmentli Progress Bar */
    .step-progress-row {
      width: 100%;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 26px;
    }
    .step-progress-track {
      height: 6px;
      border-radius: 3px;
      background: var(--line);
      overflow: hidden;
      position: relative;
    }
    .step-progress-fill {
      height: 100%;
      width: 0%;
      background: var(--brand-gradient);
      border-radius: 3px;
      transition: width 0.6s cubic-bezier(0.3, 1, 0.4, 1);
    }
    .step-progress-fill.active {
      width: 100%;
    }

    /* Staggered Step Items Animatsiyasi */
    .stagger-item {
      opacity: 0;
      transform: translateX(36px);
      transition: opacity 0.55s cubic-bezier(0.2, 0.9, 0.3, 1), transform 0.55s cubic-bezier(0.2, 0.9, 0.3, 1);
    }
    .step-active .stagger-item {
      opacity: 1;
      transform: translateX(0);
    }
    .step-active .stagger-item:nth-child(1) { transition-delay: 0.05s; }
    .step-active .stagger-item:nth-child(2) { transition-delay: 0.12s; }
    .step-active .stagger-item:nth-child(3) { transition-delay: 0.19s; }
    .step-active .stagger-item:nth-child(4) { transition-delay: 0.26s; }
    .step-active .stagger-item:nth-child(5) { transition-delay: 0.33s; }

    /* ━━ EKRAN 4: SANA KARTASI VA TA'LIM REJIMI ━━ */
    .birth-date-card {
      background: var(--inner-card-bg);
      border-radius: 26px;
      border: 2px solid var(--line);
      padding: 20px;
      box-shadow: 0 12px 32px var(--shadow);
      display: flex;

    const OY_NOMLARI = [
      'Yanvar', 'Fevral', 'Mart', 'Aprel', 'May', 'Iyun',
      'Iyul', 'Avgust', 'Sentabr', 'Oktabr', 'Noyabr', 'Dekabr'
    ];

    function calculateDaysInMonth(year, month) {
      return new Date(year, month, 0).getDate();
    }

    function calculateAge(day, month, year) {
      const today = new Date();
      let age = today.getFullYear() - year;
      const mDiff = (today.getMonth() + 1) - month;
      if (mDiff < 0 || (mDiff === 0 && today.getDate() < day)) {
        age--;
      }
      return age;
    }

    // ━━ SCREEN RENDERING ━━
    function renderApp() {
      // Update Navbar Tabs
      for (let i = 1; i <= 5; i++) {
        const btn = document.getElementById(`btn-tab-${i}`);
        if (btn) btn.classList.toggle('active', i === currentScreen);
      }

      let contentHTML = '';

      switch (currentScreen) {
        case 1:
          contentHTML = getLoginScreenHTML();
          break;
        case 2:
          contentHTML = getRegisterScreenHTML();
          break;
        case 3:
          contentHTML = getStep1HTML();
          break;
        case 4:
          contentHTML = getStep2HTML();
          break;
        case 5:
          contentHTML = getStep3HTML();
          break;
      }

      document.getElementById('mobileMountArea').innerHTML = contentHTML;
      document.getElementById('desktopMountArea').innerHTML = contentHTML;

      // Trigger stagger class
      setTimeout(() => {
        const stepCanvases = document.querySelectorAll('.step-screen-canvas');
        stepCanvases.forEach(el => el.classList.add('step-active'));
      }, 30);
    }

              <span>→</span>
            </button>
          </div>
        </div>
      `;
    }

    // ━━ NAVIGATSIYA FUNKSIYALARI ━━
    function navigateToScreen(screenNum) {
      currentScreen = screenNum;
      renderApp();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function toggleColorTheme() {
      themeMode = themeMode === 'light' ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', themeMode);
      document.getElementById('theme-text').textContent = themeMode === 'light' ? 'Tun rejimi' : 'Kun rejimi';
    }

    function togglePassVisibility(inputId, btn) {
      const inputs = document.querySelectorAll(`#${inputId}`);
      if (!inputs.length) return;
      const isPass = inputs[0].type === 'password';
      inputs.forEach(input => input.type = isPass ? 'text' : 'password');
      btn.innerHTML = isPass ? SVG.eye : SVG.eyeOff;
    }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    // ━━ INTERAKSION LOGIKA: EKRAN 1 (KIRISH) ━━
    function handleLoginSubmit(e) {
      e.preventDefault();
      const btn = e.target.querySelector('#loginSubmitBtn');
      const orig = btn.innerHTML;
      btn.classList.add('btn-loading');
      btn.innerHTML = `<div class="btn-loader-circle"></div>`;

      setTimeout(() => {
        btn.classList.remove('btn-loading');
        btn.classList.add('btn-success-state');
        btn.innerHTML = `<span>✓ Xush kelibsiz!</span>`;

        setTimeout(() => {
          btn.classList.remove('btn-success-state');
          btn.innerHTML = orig;
          alert('Muvaffaqiyatli kirdingiz!');
        }, 1600);
      }, 1000);
    }

    function simulateGoogleAuth(btn) {
      const orig = btn.innerHTML;
      btn.innerHTML = `<div class="btn-loader-circle" style="border-color:rgba(106,76,255,0.25); border-top-color:var(--brand);"></div><span>Ulanmoqda...</span>`;
      setTimeout(() => {
        btn.innerHTML = orig;
        navigateToScreen(3);
      }, 900);
    }

    // ━━ INTERAKSION LOGIKA: EKRAN 2 (RO‘YXATDAN O‘TISH) ━━
    function handleRegNameInput(input) {
      formData.name = input.value;
      const check = document.getElementById('regNameCheck');
      const box = document.getElementById('regNameBox');
      if (!check || !box) return;

      if (input.value.trim().length >= 2) {
        check.classList.add('active');
        box.classList.add('field-success');
      } else {
        check.classList.remove('active');
        box.classList.remove('field-success');
      }
    }

    function handleRegLoginInput(input) {
      formData.login = input.value;
      const check = document.getElementById('regLoginCheck');
      const box = document.getElementById('regLoginBox');
      if (!check || !box) return;

      if (input.value.trim().length >= 3) {
        check.classList.add('active');
        box.classList.add('field-success');
      } else {
        check.classList.remove('active');
        box.classList.remove('field-success');
      }
    }

    function handlePasswordStrength(input) {
      const val = input.value;
      formData.password = val;
      const b1 = document.getElementById('sbar1');
      const b2 = document.getElementById('sbar2');
      const b3 = document.getElementById('sbar3');
      const b4 = document.getElementById('sbar4');
      const hint = document.getElementById('sbarHint');
      if (!b1) return;

      const bars = [b1, b2, b3, b4];
      bars.forEach(b => b.style.backgroundColor = 'var(--line)');

      let score = 0;
      if (val.length >= 6) score = 1;
      if (val.length >= 8 && /[A-Z]/.test(val) && /[0-9]/.test(val)) score = 2;
      if (val.length >= 8 && /[A-Z]/.test(val) && /[0-9]/.test(val) && /[^A-Za-z0-9]/.test(val)) score = 3;
      if (val.length >= 10 && /[A-Z]/.test(val) && /[0-9]/.test(val) && /[^A-Za-z0-9]/.test(val)) score = 4;

      if (val.length === 0) {
        hint.textContent = 'Parol kamida 8 ta belgidan iborat bo‘lsin.';
        hint.style.color = 'var(--mute)';
        handleConfirmPasswordMatch();
        return;
      }

      const colors = ['#e5484d', '#f59e0b', '#84cc16', '#22c55e'];
      const labels = ['Zaif parol', 'O‘rtacha parol', 'Yaxshi parol', 'Juda kuchli parol!'];

      for (let i = 0; i < score; i++) {
        bars[i].style.backgroundColor = colors[score - 1];
      }
      hint.textContent = labels[Math.max(0, score - 1)];
      hint.style.color = colors[Math.max(0, score - 1)];

      handleConfirmPasswordMatch();
    }

    function handleConfirmPasswordMatch() {
      const pass = formData.password;
      const confirmInput = document.getElementById('regConfirmInput');
      const box = document.getElementById('regConfirmBox');
      const check = document.getElementById('regConfirmCheck');
      if (!confirmInput || !box) return;

      const val = confirmInput.value;
      formData.confirmPassword = val;

      if (val.length === 0) {
        box.classList.remove('field-success', 'field-error');
        if (check) check.classList.remove('active');
        return;
      }

      if (val === pass && pass.length >= 6) {
        box.classList.add('field-success');
        box.classList.remove('field-error');
        if (check) check.classList.add('active');
      } else {
        box.classList.add('field-error');
        box.classList.remove('field-success');
        if (check) check.classList.remove('active');
      }
    }

    function handleRegisterSubmit(e) {
      e.preventDefault();
      const card = document.getElementById('registerCard');

      if (!formData.name || formData.name.trim().length < 2 ||
          !formData.login || formData.login.trim().length < 3 ||
          !formData.password || formData.password.length < 6 ||
          formData.password !== formData.confirmPassword) {
        // Trigger Shake
        card.classList.remove('shake-trigger');
        void card.offsetWidth;
        card.classList.add('shake-trigger');
        return;
      }

      // Pre-fill Step 1 username from Name or Login
      formData.username = formData.name.trim().replace(/\s+/g, '');
      navigateToScreen(3);
    }

    // ━━ INTERAKSION LOGIKA: EKRAN 3 (1-BOSQICH: USERNAME) ━━
    function handleStep1UsernameInput(input) {
      const val = input.value.trim();
      formData.username = val;
      const box = document.getElementById('step1UsernameBox');
      const hint = document.getElementById('step1Hint');
      const check = document.getElementById('step1Check');
      if (!box || !hint || !check) return;

      const latinAlphaNum = /^[A-Za-z0-9]+$/;

      if (val.length === 0) {
        box.classList.remove('field-success', 'field-error');
        check.classList.remove('active');
        hint.style.color = 'var(--mute)';
        hint.textContent = 'Foydalanuvchi nomi faqat lotin harflari va raqamlardan iborat bo‘lishi lozim.';
        return;
      }

      if (!latinAlphaNum.test(val)) {
        box.classList.add('field-error');
        box.classList.remove('field-success');
        check.classList.remove('active');
        hint.style.color = 'var(--error)';
        hint.textContent = 'Faqat lotin harflari va raqamlardan foydalaning.';
        return;
      }

      if (val.length < 3) {
        box.classList.add('field-error');
        box.classList.remove('field-success');
        check.classList.remove('active');
        hint.style.color = 'var(--error)';
        hint.textContent = 'Kamida 3 ta lotin harfi yoki raqam kiriting.';
        return;
      }

      // Valid
      box.classList.remove('field-error');
      box.classList.add('field-success');
      check.classList.add('active');
      hint.style.color = 'var(--success)';
      hint.textContent = 'Ajoyib tanlov!';
    }

    function handleStep1Submit(e) {
      e.preventDefault();
      const val = formData.username.trim();
      const box = document.getElementById('step1UsernameBox');
      const hint = document.getElementById('step1Hint');

      if (!val || val.length < 3 || !/^[A-Za-z0-9]+$/.test(val)) {
        box.classList.remove('shake-trigger');
        void box.offsetWidth;
        box.classList.add('shake-trigger');
        if (hint) {
          hint.style.color = 'var(--error)';
          hint.textContent = 'Kamida 3 ta lotin harfi yoki raqam kiriting.';
        }
        return;
      }

      navigateToScreen(4);
    }

    // ━━ INTERAKSION LOGIKA: EKRAN 4 (2-BOSQICH: SANA & REJIM) ━━
    function onDateChanged() {
      const dSel = document.getElementById('birthDaySelect');
      const mSel = document.getElementById('birthMonthSelect');
      const ySel = document.getElementById('birthYearSelect');
      if (!dSel || !mSel || !ySel) return;

      const year = parseInt(ySel.value, 10);
      const month = parseInt(mSel.value, 10);
      let day = parseInt(dSel.value, 10);

      const maxDays = calculateDaysInMonth(year, month);
      if (day > maxDays) day = maxDays;

      formData.birthYear = year;
      formData.birthMonth = month;
      formData.birthDay = day;

      // Update days options
      dSel.innerHTML = '';
      for (let d = 1; d <= maxDays; d++) {
        const opt = document.createElement('option');
        opt.value = d;
        opt.textContent = d;
        if (d === day) opt.selected = true;
        dSel.appendChild(opt);
      }

      // Calculate age
      const newAge = calculateAge(day, month, year);
      const ageChanged = newAge !== formData.calculatedAge;
      formData.calculatedAge = newAge;

      // Update Header Text & Badge
      const fDay = String(day).padStart(2, '0');
      const fMonth = String(month).padStart(2, '0');
      document.getElementById('dateTextFormatted').textContent = `${fDay}.${fMonth}.${year}`;

      const ageBadge = document.getElementById('ageBadge');
      ageBadge.textContent = `${newAge} yosh`;
      if (ageChanged) {
        ageBadge.classList.remove('pop');
        void ageBadge.offsetWidth;
        ageBadge.classList.add('pop');
      }

      // Auto-select mode based on age
      const kidsCard = document.getElementById('modeCardKids');
      const teensCard = document.getElementById('modeCardTeens');
      const errorHint = document.getElementById('ageErrorHint');

      if (newAge >= 6 && newAge <= 12) {
        selectEducationMode('Bolalar rejimi');
        errorHint.style.display = 'none';
      } else if (newAge >= 13 && newAge <= 16) {
        selectEducationMode('O‘smirlar rejimi');
        errorHint.style.display = 'none';
      } else {
        // Outside 6-16
        kidsCard.classList.remove('selected');
        teensCard.classList.remove('selected');
        formData.educationMode = '';
        errorHint.style.display = 'block';
      }
    }

    function selectEducationMode(mode) {
      formData.educationMode = mode;
      const kidsCard = document.getElementById('modeCardKids');
      const teensCard = document.getElementById('modeCardTeens');
      if (!kidsCard || !teensCard) return;

      kidsCard.classList.toggle('selected', mode === 'Bolalar rejimi');
      teensCard.classList.toggle('selected', mode === 'O‘smirlar rejimi');
      kidsCard.setAttribute('aria-checked', mode === 'Bolalar rejimi');
      teensCard.setAttribute('aria-checked', mode === 'O‘smirlar rejimi');
    }

    function handleStep2Submit() {
      const errorHint = document.getElementById('ageErrorHint');
      const dateCard = document.getElementById('dateCardWrap');

      if (formData.calculatedAge < 6 || formData.calculatedAge > 16 || !formData.educationMode) {
        errorHint.style.display = 'block';
        dateCard.classList.remove('shake-trigger');
        void dateCard.offsetWidth;
        dateCard.classList.add('shake-trigger');
        return;
      }

      navigateToScreen(5);
    }

    // ━━ INTERAKSION LOGIKA: EKRAN 5 (3-BOSQICH: YAKUNLASH) ━━
    function handleFinishRegistration(btn) {
      const orig = btn.innerHTML;
      btn.classList.add('btn-loading');
      btn.innerHTML = `<div class="btn-loader-circle"></div>`;

      setTimeout(() => {
        btn.classList.remove('btn-loading');
        btn.innerHTML = orig;
        triggerCelebrationModal();
      }, 1300);
    }

    function triggerCelebrationModal() {
      const modal = document.getElementById('celebrationModal');
      const title = document.getElementById('celebrationTitle');
      title.textContent = `Hisob yaratildi, ${formData.username}!`;

      // Generate 26 Falling Confetti math glyphs
      const container = document.getElementById('confettiContainer');
      container.innerHTML = '';
      const symbols = ['+', '−', '×', '÷', 'π', '√', '%'];

      for (let i = 0; i < 26; i++) {
        const span = document.createElement('span');
        span.className = 'falling-confetti-item';
        span.textContent = symbols[Math.floor(Math.random() * symbols.length)];
        span.style.left = `${Math.random() * 95}%`;
        span.style.fontSize = `${24 + Math.random() * 26}px`;
        span.style.animationDuration = `${3 + Math.random() * 3}s`;
        span.style.animationDelay = `${Math.random() * 2}s`;
        container.appendChild(span);
      }

      modal.classList.add('active');
    }

    function finishCelebration() {
      const modal = document.getElementById('celebrationModal');
      modal.classList.remove('active');
      navigateToScreen(1);
    }

    // Initial Start
    renderApp();
  </script>
</body>
</html>
