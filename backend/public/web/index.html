  <!-- Safe DOM guard, GSI duplicate suppressor & Clean Console logger -->
  <script>
    (function () {
      // 0. Console Logger Filter for GSI internal telemetry, preloads & noisy third-party notices
      ['log', 'info', 'warn', 'debug'].forEach(function (level) {
        var orig = console[level];
        if (!orig) return;
        console[level] = function () {
          var firstArg = arguments[0];
          if (typeof firstArg === 'string' && (
            firstArg.indexOf('[GSI_LOGGER') !== -1 ||
            firstArg.indexOf('google.accounts.id.initialize') !== -1 ||
            firstArg.indexOf('was preloaded using link preload') !== -1 ||
            firstArg.indexOf('FedCM mode') !== -1 ||
            firstArg.indexOf('Experiment enable_itp_optimization') !== -1
          )) {
            return;
          }
          return orig.apply(console, arguments);
        };
      });

      // 1. Guard Node.prototype.removeChild against null/detached/mismatched parents
      var origRemoveChild = Node.prototype.removeChild;
      Node.prototype.removeChild = function (child) {
        if (!child) return null;
        if (!child.parentNode || child.parentNode !== this) {
          if (child.parentNode && typeof child.remove === 'function') {
            try { child.remove(); } catch (_) { }
          }
          return child;
        }
        try {
          return origRemoveChild.apply(this, arguments);
        } catch (_) {
          return child;
        }
      };

      // 2. Guard Element.prototype.remove
      if (Element.prototype.remove) {
        var origRemove = Element.prototype.remove;
        Element.prototype.remove = function () {
          if (!this || !this.parentNode) return;
          try {
            origRemove.apply(this, arguments);
          } catch (_) { }
        };
      }

      // 3. Single-use { once: true } listener for Flutter first frame splash removal
      window.addEventListener('flutter-first-frame', function () {
        var splash = document.querySelector('.loading') || document.querySelector('#loading') || document.querySelector('#splash');
        if (splash && splash.parentNode) {
          try {
            if (typeof splash.remove === 'function') {
              splash.remove();
            } else {
              splash.parentNode.removeChild(splash);
            }
          } catch (_) { }
        }
      }, { once: true });

      // 4. Safe single initialization guard for Google Identity Services (GSI)
      var isGsiInitialized = false;
      function wrapGsi(idObj) {
        if (!idObj || idObj._mathcityPatched) return;
        var origInit = idObj.initialize;
        idObj.initialize = function (config) {
          if (isGsiInitialized) {
            return;
          }
          isGsiInitialized = true;
          return origInit.apply(this, arguments);
        };
        idObj._mathcityPatched = true;
      }

      var gsiTimer = setInterval(function () {
        if (window.google && window.google.accounts && window.google.accounts.id) {
          wrapGsi(window.google.accounts.id);
        }
      }, 25);
      setTimeout(function () { clearInterval(gsiTimer); }, 20000);
    })();
  </script>
