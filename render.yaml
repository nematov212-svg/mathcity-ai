databases:
  - name: mathcity-ai-db
    databaseName: mathcity_ai
    user: mathcity_admin
    plan: standard
    region: frankfurt

services:
  # ----------------------------------------------------------------------------
  # 1. MathCity AI Backend API (Node.js + Express + Prisma + PostgreSQL)
  # ----------------------------------------------------------------------------
  - type: web
    name: mathcity-ai-api
    runtime: node
    rootDir: backend
    plan: starter
    region: frankfurt
    buildCommand: npm run render:build
    startCommand: npm run render:start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: mathcity-ai-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: ALLOWED_ORIGINS
        value: https://mathcity-ai-web.onrender.com,https://mathcity-ai-admin.onrender.com,http://localhost:7357,http://localhost:3000
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: OBJECT_STORAGE_ENDPOINT
        value: https://storage.mathcity.ai

  # ----------------------------------------------------------------------------
  # 2. MathCity AI Student Web Application (Flutter Web Static Site)
  # ----------------------------------------------------------------------------
  - type: web
    name: mathcity-ai-web
    runtime: static
    rootDir: frontend
    buildCommand: ./build_web.sh
    staticPublishPath: build/web
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: API_BASE_URL
        value: https://mathcity-ai-api.onrender.com

  # ----------------------------------------------------------------------------
  # 3. MathCity AI Administrator Dashboard (Static Site)
  # ----------------------------------------------------------------------------
  - type: web
    name: mathcity-ai-admin
    runtime: static
    rootDir: backend/public/admin
    buildCommand: echo "Admin panel assets ready"
    staticPublishPath: .
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
