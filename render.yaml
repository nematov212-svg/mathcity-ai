databases:
  - name: mathcity-ai-db
    databaseName: mathcity_ai
    user: mathcity_admin
    plan: free
    region: frankfurt

services:
  - type: web
    name: mathcity-ai-api
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm run render:build
    startCommand: npm run render:start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: mathcity-ai-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: ADMIN_API_KEY
        value: mathcity_admin_master_secret_2026
      - key: ADMIN_EMAIL
        value: admin@mathcity.ai
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        value: MathCity@Admin2026!Secure
      - key: ALLOWED_ORIGINS
        value: https://mathcity-ai-web.onrender.com,https://mathcity-ai-admin.onrender.com,http://localhost:8085
      - key: ALLOW_LOCALHOST_ORIGINS
        value: "true"
      - key: GOOGLE_CLIENT_ID
        value: 608766203356-d6oq3gvc5n199671ho1npgr240afkjup.apps.googleusercontent.com
      - key: OBJECT_STORAGE_ENDPOINT
        value: https://storage.mathcity.ai
